name: Keep current downloads
on:
  push:
    branches: [main]
    paths: ['.github/workflows/current-downloads.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
      - name: Retain current Stable and Beta downloads
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          repo=os.environ['REPOSITORY']
          if repo!='mattheube/MyProjects': raise SystemExit('Unexpected repository')
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def api(repo,path,method='GET'):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,headers=headers,method=method)
              with urllib.request.urlopen(req) as r:
                  data=r.read()
                  return json.loads(data) if data else None
          keep={'v2.2.0','v2.7.0-beta.14'}
          releases=api(repo,'/releases?per_page=100')
          for release in releases:
              tag=release['tag_name']
              if tag in keep: continue
              source=api('mattheube/MyVoice','/releases/tags/'+tag)
              original={a['name']:(a['size'],a.get('digest')) for a in source['assets']}
              copied={a['name']:(a['size'],a.get('digest')) for a in release['assets']}
              if original != copied: raise SystemExit('Backup mismatch for '+tag)
              api(repo,'/releases/'+str(release['id']),'DELETE')
              api(repo,'/git/refs/tags/'+tag,'DELETE')
              print('Removed duplicate historical release '+tag+'; original retained.')
          assert {r['tag_name'] for r in api(repo,'/releases?per_page=100')}==keep
          PY
