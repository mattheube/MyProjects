name: Complete current MyVoice release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-beta15.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare and verify the current release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/import-beta15.mjs
