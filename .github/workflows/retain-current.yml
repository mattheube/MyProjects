name: Retain current MyVoice downloads
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retain-current.yml']
permissions:
  contents: write
jobs:
  retain:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the current release before retiring its predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REPOSITORY" = "mattheube/MyProjects"
          gh api repos/$GITHUB_REPOSITORY/releases/437027153 --jq 'select(.draft == false and .tag_name == "v2.7.0-beta.15") | .assets | length' | grep -qx 5
          test "$(gh api repos/$GITHUB_REPOSITORY/releases/436962088 --jq .tag_name)" = "v2.7.0-beta.14"
          gh api --method DELETE repos/$GITHUB_REPOSITORY/releases/436962088
          gh api --method DELETE repos/$GITHUB_REPOSITORY/git/refs/tags/v2.7.0-beta.14
